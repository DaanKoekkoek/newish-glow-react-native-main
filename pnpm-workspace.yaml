packages:
  - "packages/*"
  - "examples/*"

# Notes, overrides in the root package.json will supersede these package versions
catalogs:
  # Can be referenced through "catalog:current"
  current:
    "@babel/core": 7.25.2
    # This is currently used in the lib, we should consider removing the
    # dependency on an expo module.
    "@expo/html-elements": 0.10.1
    "@expo/metro-runtime": ~3.1.3
    "@odido-portals/glow-icon": 0.6.7
    "@odido-portals/glow-tokens": 2.1.4
    "@types/react": ~18.2.45
    "babel-loader": ^8.2.3
    expo-asset: 9.0.2
    expo-constants: ~15.4.6
    expo-linear-gradient: ~12.7.2
    expo-status-bar: ~1.12.1
    expo: 50.0.20
    jest-expo: ~50.0.3
    motion: 11.14.3
    react-dom: 18.2.0
    react-native-fast-shadow: 0.1.0
    react-native-gesture-handler: ~2.16.1
    react-native-get-random-values: 1.11.0
    react-native-reanimated: ~3.10.1
    react-native-safe-area-context: ^4.10.1
    react-native-svg: 15.7.1
    react-native-unistyles: 2.8.4
    react-native-web: 0.19.12
    react-native-web-hooks: 3.0.2
    react-native: 0.73.6
    react: 18.2.0
    typescript: ~5.5.3

  # support these versions, specifically RN and expo Can be referenced through
  # "catalog:expo51-next"
  expo51-next:
    "@babel/core": 7.25.2 # 7.24.9
    # This is currently used in the lib, we should consider removing the
    # dependency on an expo module.
    "@expo/html-elements": 0.10.1
    "@odido-portals/glow-icon": 0.5.3
    "@odido-portals/glow-tokens": 1.19.3
    "@types/react": ~18.2.45
    "babel-loader": 8.3.0
    expo-asset: 11.0.1
    expo-constants: 16.0.2
    expo-linear-gradient: 13.0.2
    expo-status-bar: 1.12.1
    expo: 51.0.24
    jest-expo: 51.0.3
    react-dom: 18.2.0
    react-native-fast-shadow: 0.1.0
    react-native-reanimated: 3.10.1
    react-native-safe-area-context: 4.10.5
    react-native-svg: 15.7.1
    react-native-unistyles: 2.8.3
    react-native-web: 0.19.12
    react-native: 0.74.3
    react: 18.2.0
    typescript: 5.5.4
